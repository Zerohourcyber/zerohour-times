name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # gitleaks needs history
      - name: Project secret scan
        run: python3 scripts/scan-secrets.py
      - name: gitleaks (second opinion, including history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: Python checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]    # 3.9 is the floor (zoneinfo)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile every module
        run: python -m compileall -q zhtimes scripts samples
      - name: No third-party imports
        # The whole install story rests on this being true. If someone adds a
        # dependency, CI should say so before a user hits a pip failure.
        # Detection is by spec origin rather than sys.stdlib_module_names,
        # which only exists on 3.10+ and would make this step itself the thing
        # that breaks the 3.9 build.
        run: |
          python - <<'PY'
          import ast, importlib.util, pathlib, sys
          local = {p.stem for p in pathlib.Path("zhtimes").glob("*.py")}
          third = []
          for f in sorted(pathlib.Path("zhtimes").glob("*.py")):
              for node in ast.walk(ast.parse(f.read_text())):
                  if isinstance(node, ast.Import):
                      mods = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      mods = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for m in mods:
                      if not m or m in local or m in sys.builtin_module_names:
                          continue
                      try:
                          spec = importlib.util.find_spec(m)
                      except (ImportError, ValueError):
                          third.append(f"{f.name}: {m} (not importable)")
                          continue
                      origin = (spec.origin or "") if spec else ""
                      if "site-packages" in origin or "dist-packages" in origin:
                          third.append(f"{f.name}: {m}")
          if third:
              print("Third-party imports found:\n  " + "\n  ".join(sorted(set(third))))
              sys.exit(1)
          print("stdlib only — no dependencies to install")
          PY

      - name: Modules import and run on this version
        # compileall only proves it parses. This proves the code actually loads
        # on the oldest supported interpreter.
        run: |
          ZHT_STATE_DIR=/tmp/zht ZHT_WWW_DIR=/tmp/zht/www python - <<'PY'
          import sys
          sys.path.insert(0, "zhtimes")
          import settings, discover, match, research, report, resolve, run
          print(f"all modules import on Python {'.'.join(map(str, sys.version_info[:3]))}")
          print(f"  timezone handling: {settings.TZ_NAME}")
          print(f"  scheduler next-run logic: {run.next_run.__name__} present")
          PY

  render:
    name: Dashboard renders from sample data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the demo front page
        run: |
          ZHT_STATE_DIR="$PWD/samples/state" ZHT_WWW_DIR="$PWD/out" \
            python3 zhtimes/report.py --config config.example.json
      - name: Assert it looks like a newspaper
        run: |
          python3 - <<'PY'
          import pathlib, sys
          t = pathlib.Path("out/index.html").read_text()
          checks = {
              "masthead":            "The ZeroHour Times" in t,
              "three sample jobs":   t.count('<details class="ad"') == 3,
              "apply badge":         "b-apply" in t,
              "explore badge":       "b-explore" in t,
              "skip badge":          "b-skip" in t,
              "research section":    "Our Correspondent Reports" in t,
              "validator downgrade": "Automated downgrade" in t,
              "help wanted panel":   "Help Wanted" in t,
              "no unrendered escapes": "\\n" not in t,
          }
          for k, v in checks.items():
              print(f"  {'ok ' if v else 'FAIL'} {k}")
          sys.exit(0 if all(checks.values()) else 1)
          PY

  compose:
    name: Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate with placeholder secrets
        run: |
          printf 'AUTH_SECRET=ci\nENCRYPTION_KEY=ci\n' > .env
          docker compose config --quiet
          echo "compose config valid"
      - name: Fails loudly without secrets
        run: |
          rm -f .env
          if docker compose config --quiet 2>/dev/null; then
            echo "expected compose to refuse to start without AUTH_SECRET"; exit 1
          fi
          echo "correctly refuses to start unconfigured"
